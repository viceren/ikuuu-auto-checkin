name: 临时清理

# 一次性：关闭验证用的测试 issue #1，随后本文件将被删除
on: push

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 关闭测试 issue #1
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.issues.update({
                owner, repo, issue_number: 1, state: 'closed'
              });
              core.info('✓ 已关闭测试 issue #1');
            } catch (err) {
              core.info(`issue #1 已关闭或不存在：${err.message}`);
            }
