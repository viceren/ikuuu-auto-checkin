name: ikuuu 每日签到

on:
  schedule:
    # 北京时间每天 06:00 (UTC 22:00 前一天)
    - cron: '0 22 * * *'
  workflow_dispatch: # 支持手动触发

# 显式声明 GITHUB_TOKEN 权限，避免受仓库默认 read-only 设置影响
# （issues: write 是失败通知能创建 issue 的前提）
permissions:
  contents: read
  issues: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        id: checkin
        env:
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
          # 域名会不定期更换：可在仓库 Variables 设置 IKUUU_BASE_URL 覆盖，
          # 未设置时回退到代码内置默认值。失效时运行 python find_domain.py 探测。
          IKUUU_BASE_URL: "${{ vars.IKUUU_BASE_URL || 'https://ikuuu.top' }}"
        run: python checkin.py

      - name: 签到失败通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const date = new Date().toISOString().slice(0, 10);
            const title = `⚠️ ikuuu 签到失败 - ${date}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '今日签到脚本执行失败。',
              '',
              '**排查顺序：**',
              '1. **域名是否已更换**（近期高发）→ 运行 `python find_domain.py` 探测最新域名，'
                + '在仓库 Variables 更新 `IKUUU_BASE_URL`',
              '2. Cookie 已过期（约 7 天失效一次）→ 运行 `python refresh_cookie.py` 刷新并回写 Secret',
              '3. 网站不可达 / 风控拦截',
              '',
              `详情见 [Actions 日志](${runUrl})。`
            ].join('\n');

            // 去重：同一天已有同名 issue 则追加评论，避免重复创建刷屏
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 30,
            });
            const dup = openIssues.find(
              i => !i.pull_request && i.title === title
            );

            if (dup) {
              const stamp = new Date().toISOString();
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: dup.number,
                body: `签到再次失败：${stamp}\n\n${runUrl}`
              });
              core.info(`已追加评论到已存在的 issue #${dup.number}`);
            } else {
              try {
                const { data: created } = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                });
                core.info(`已创建失败通知 issue #${created.number}`);
              } catch (err) {
                // 兜底：即使 issue 创建失败，也要让失败可见，绝不能静默
                core.setFailed(
                  `签到失败，且通知 issue 创建失败（${err.status || 'unknown'}）：${err.message}`
                );
              }
            }
